services:
  db:
    image: postgres:16-alpine

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-shelfsense}"
      POSTGRES_USER: "${POSTGRES_USER:-shelfsense}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}"

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:13.4.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: "jdbc:postgresql://db:5432/${POSTGRES_DB:-shelfsense}"
      FLYWAY_USER: "${POSTGRES_USER:-shelfsense}"
      FLYWAY_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required; copy .env.example to .env}"
      FLYWAY_LOCATIONS: "filesystem:/flyway/sql"
      FLYWAY_CONNECT_RETRIES: "10"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_VALIDATE_MIGRATION_NAMING: "true"
    volumes:
      - ./migrations:/flyway/sql:ro
    command: migrate

volumes:
  postgres_data:
